name: sistema_servicios
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # --- FIREBASE Y NÚCLEO ---
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0
  firebase_storage: ^12.1.0 # <--- NUEVO: Para guardar las fotos
  
  # --- MAPAS Y UBICACIÓN ---
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  
  # --- UTILIDADES ---
